name: Build

# Every push builds the debug APK and runs the unit tests; a push to master also
# builds the release APK, signed with the keystore in the repository's secrets, and
# publishes it as a GitHub release numbered by the run.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Debug APK and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK platform
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-37.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: logsizer-api-caller-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Release
    if: github.ref == 'refs/heads/master'
    needs: apk
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK platform
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-37.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      - name: Build the signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "logsizer-api-caller-$VERSION.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Logsizer API Caller ${{ env.VERSION }}
          generate_release_notes: true
          files: logsizer-api-caller-${{ env.VERSION }}.apk
